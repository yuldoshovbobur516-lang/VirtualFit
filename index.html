<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VirtualFit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#16140f;--muted:#6f6a60;--line:#e4dfd6;--accent:#c8553d;--s1:#efe9df;--s2:#d6cdbf;--chip:rgba(255,255,255,.88);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--card:#1e1b17;--ink:#f3eee6;--muted:#a39d91;--line:#33302a;--accent:#e0694f;--s1:#2c2822;--s2:#17150f;--chip:rgba(30,27,23,.88)}}
:root[data-theme="dark"]{--bg:#14120f;--card:#1e1b17;--ink:#f3eee6;--muted:#a39d91;--line:#33302a;--accent:#e0694f;--s1:#2c2822;--s2:#17150f;--chip:rgba(30,27,23,.88)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:26px;letter-spacing:-.01em}
.logo i{color:var(--accent);font-style:normal}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(28px,6vw,44px);line-height:1.1;margin:18px 0 6px}
.sub{color:var(--muted);margin:0 0 18px;max-width:46ch}
.grid{display:grid;gap:22px}
@media(min-width:900px){.grid{grid-template-columns:1.1fr 1fr;align-items:start}.stage-col{position:sticky;top:16px}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.stage{position:relative;margin-top:12px;width:100%;aspect-ratio:4/5;max-height:68vh;border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 15%,var(--s1),var(--s2));touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
.chip{position:absolute;top:12px;left:12px;right:12px;width:fit-content;max-width:calc(100% - 24px);font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.hint{position:absolute;left:0;right:0;bottom:62px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;margin:0;color:var(--muted)}
.ctrl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;justify-content:center}
.ctrl button{min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-weight:600;font-size:14px;cursor:pointer}
.ctrl button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-family:"Playfair Display",Georgia,serif;font-size:22px;margin:0 0 4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:0 0 14px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;min-height:44px}
.card b{font-size:14px}.card span{font-size:13px;color:var(--muted)}
.card[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.label{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
.sws{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:2px}
.sum{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.sum b{font-size:18px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
try{const w=window.Telegram&&Telegram.WebApp;if(w){w.ready();w.expand();w.disableVerticalSwipes&&w.disableVerticalSwipes()}}catch(e){}
const {useState,useRef,useEffect}=React,h=React.createElement,T=THREE;

/* ===== Data =====
   Realistic GLB models later: set glbUrl, load GLTFLoader and return a rig {root,core,cloth,arms,pop}. */
const AVATARS={
 male:{label:'Male',glbUrl:'male.glb',zs:.66,hipX:.088,shoulder:.235,ak:1,
  torso:[[.150,.84],[.150,.92],[.145,1.0],[.150,1.12],[.170,1.28],[.200,1.41],[.060,1.50]],
  leg:[[.034,.07],[.058,.30],[.050,.48],[.075,.68],[.088,.93]]},
 female:{label:'Female',glbUrl:'female.glb',zs:.7,hipX:.088,shoulder:.19,ak:.84,
  torso:[[.172,.84],[.176,.90],[.150,.98],[.118,1.08],[.145,1.27],[.165,1.41],[.055,1.50]],
  leg:[[.030,.07],[.052,.30],[.046,.48],[.078,.68],[.092,.93]]}
};
const ARM=[[.028,-.54],[.038,-.40],[.037,-.28],[.049,-.12],[.052,0]];
const TOPS=[
 {id:'tshirt',name:'T-shirt',price:29,grow:.014,drop:0,sleeve:.2,colors:[{n:'Sand',c:'#d9c7a3'},{n:'White',c:'#f1efe9'},{n:'Terracotta',c:'#c8553d'},{n:'Navy',c:'#243a5e'}]},
 {id:'hoodie',name:'Hoodie',price:59,grow:.03,drop:.05,sleeve:.54,hood:1,pocket:1,colors:[{n:'Grey',c:'#8a8d91'},{n:'Black',c:'#26262a'},{n:'Forest',c:'#35573f'},{n:'Plum',c:'#6d3b5a'}]},
 {id:'jacket',name:'Jacket',price:89,grow:.026,drop:.09,sleeve:.54,collar:1,zip:1,colors:[{n:'Olive',c:'#5f6a3c'},{n:'Black',c:'#1e1e21'},{n:'Camel',c:'#b58a55'},{n:'Denim',c:'#3c5a82'}]},
 {id:'shirt',name:'Shirt',price:45,grow:.016,drop:.04,sleeve:.54,collar:1,placket:1,colors:[{n:'White',c:'#f1efe9'},{n:'Sky',c:'#9dbfe0'},{n:'Rose',c:'#d99aa5'},{n:'Black',c:'#26262a'}]}
];
const BOTTOMS=[
 {id:'jeans',name:'Jeans',price:49,grow:.016,ymin:.08,colors:[{n:'Denim',c:'#3c5a82'},{n:'Black',c:'#1e1e21'},{n:'Khaki',c:'#a08f68'},{n:'Grey',c:'#6f7378'}]},
 {id:'shorts',name:'Shorts',price:35,grow:.016,ymin:.55,colors:[{n:'Khaki',c:'#a08f68'},{n:'Navy',c:'#243a5e'},{n:'Black',c:'#1e1e21'},{n:'Olive',c:'#5f6a3c'}]},
 {id:'skirt',name:'Skirt',price:39,skirt:1,fOnly:1,colors:[{n:'Black',c:'#1e1e21'},{n:'Wine',c:'#7a2e3f'},{n:'Denim',c:'#3c5a82'},{n:'Cream',c:'#e8dcc4'}]}
];
const YAW={front:0,side:Math.PI/2,back:Math.PI};
/* ===== GLB bodies: male.glb / female.glb hold the body (arms-down pose, smoothed head) plus garment shells fitted to its surface ===== */
const LOADERS=['https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js','https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js'];
let loaderP;
function ensureLoader(){
 if(T.GLTFLoader)return Promise.resolve();
 return loaderP||(loaderP=LOADERS.reduce((p,u)=>p.then(()=>{if(T.GLTFLoader)return;return new Promise(ok=>{const e=document.createElement('script');e.src=u;e.onload=e.onerror=()=>ok();document.head.appendChild(e)})}),Promise.resolve()));
}
const gMat=c=>new T.MeshStandardMaterial({color:c,roughness:.85,side:T.DoubleSide,vertexColors:true});
async function buildGLB(a){
 if(!a.glbUrl)return null;
 await ensureLoader();
 const g=await new Promise((ok,no)=>new T.GLTFLoader().load(a.glbUrl,ok,undefined,no));
 const root=new T.Group(),core=new T.Group(),gar={};
 root.add(mesh(new T.CylinderGeometry(.42,.45,.04,48),new T.MeshStandardMaterial({color:0x2b2823,roughness:.5}),0,.02,0));
 g.scene.position.y=.04;core.add(g.scene);root.add(core);
 g.scene.traverse(o=>{if(!o.isMesh)return;
  if(o.name==='body')o.material=new T.MeshStandardMaterial({color:0xd8d3ca,roughness:.65});
  else{gar[o.name]=o;o.visible=false;o.material=gMat(0xffffff)}});
 return {root,core,cloth:new T.Group(),arms:[],pop:0,glb:1,gar};
}
function dressGLB(r,top,bottom){
 Object.values(r.gar).forEach(m=>{m.visible=false});
 [top,bottom].forEach(x=>{const m=x&&r.gar[x.g.id];if(m){m.material.dispose();m.material=gMat(x.c);m.visible=true}});
}

/* ===== 3D helpers ===== */
const skinMat=()=>new T.MeshStandardMaterial({color:0xd8d3ca,roughness:.65,metalness:.05,side:T.DoubleSide});
const mesh=(g,m,x=0,y=0,z=0)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);return o};
// smooth lathe through (radius,y) control points, kept between y0 and y1, thickened by grow
function band(ctrl,grow,y0,y1,zs,mat){
 const pts=new T.SplineCurve(ctrl.map(p=>new T.Vector2(p[0],p[1]))).getPoints(48).filter(p=>p.y>=y0&&p.y<=y1).map(p=>new T.Vector2(p.x+grow,p.y));
 const m=new T.Mesh(new T.LatheGeometry(pts,36),mat);m.scale.z=zs;return m;
}
function dispose(o){o.traverse(n=>{n.geometry&&n.geometry.dispose();n.material&&n.material.dispose&&n.material.dispose()})}
const armCtrl=a=>ARM.map(p=>[p[0]*a.ak,p[1]]);

function buildBody(a){ // placeholder mannequin: faceless, smooth curves
 const m=skinMat(),root=new T.Group(),core=new T.Group(),cloth=new T.Group(),arms=[],ac=armCtrl(a);
 root.add(mesh(new T.CylinderGeometry(.42,.45,.04,48),new T.MeshStandardMaterial({color:0x2b2823,roughness:.5}),0,.02,0));
 [-1,1].forEach(s=>{
  const leg=band(a.leg,0,0,1,1,m);leg.position.x=s*a.hipX;root.add(leg);
  const ft=mesh(new T.SphereGeometry(.05,16,12),m,s*a.hipX,.05,.05);ft.scale.set(.85,.5,2);root.add(ft);
  const g=new T.Group();g.position.set(s*a.shoulder,1.41,0);g.userData.s=s;
  g.add(band(ac,0,-1,1,1,m),mesh(new T.SphereGeometry(.056*a.ak,16,12),m));
  const hd=mesh(new T.SphereGeometry(.032*a.ak,14,10),m,0,-.6,0);hd.scale.set(.8,1.4,.6);g.add(hd);
  g.rotation.z=s*.07;root.add(g);arms.push(g);
 });
 const head=mesh(new T.SphereGeometry(.105,32,24),m,0,1.68,0);head.scale.set(.9,1.08,1);
 core.add(band(a.torso,0,0,9,a.zs,m),head,mesh(new T.CylinderGeometry(.045,.05,.14,16),m,0,1.52,0),cloth);
 root.add(core);
 return {root,core,cloth,arms,pop:0};
}
function clearCloth(r){
 [r.cloth,...r.arms].flatMap(p=>p.children.filter(c=>p===r.cloth||c.userData.cloth)).forEach(o=>{o.parent.remove(o);dispose(o)});
}
function dress(r,a,top,bottom){
 if(r.glb)return dressGLB(r,top,bottom);
 clearCloth(r);
 const mk=(c,k=1)=>new T.MeshStandardMaterial({color:new T.Color(c).multiplyScalar(k),roughness:.85,side:T.DoubleSide}),ac=armCtrl(a);
 if(top){const g=top.g,mat=mk(top.c),dk=mk(top.c,.6),L=g.sleeve,k=g.grow*.8+.008;
  r.cloth.add(band(a.torso.map((p,i)=>[p[0]+g.grow,i?p[1]:p[1]-g.drop]),0,0,9,a.zs,mat));
  r.arms.forEach(arm=>{const s=band(ac,k,-L,.02,1,mat),c=mesh(new T.SphereGeometry(.052*a.ak+k,16,12),mat);s.userData.cloth=c.userData.cloth=1;arm.add(s,c)});
  if(g.hood){const hd=mesh(new T.SphereGeometry(.11,24,16),mat,0,1.5,-.075);hd.scale.set(1.15,.85,.85);r.cloth.add(hd)}
  if(g.pocket)r.cloth.add(mesh(new T.BoxGeometry(.18,.07,.03),dk,0,1.0,.125));
  if(g.collar)r.cloth.add(mesh(new T.CylinderGeometry(.07,.09,.075,24,1,true),mat,0,1.5,0));
  if(g.zip)r.cloth.add(mesh(new T.BoxGeometry(.012,.56,.03),dk,0,1.14,.128));
  if(g.placket)r.cloth.add(mesh(new T.BoxGeometry(.03,.56,.03),mk(top.c,1.12),0,1.14,.125));
 }
 if(bottom){const g=bottom.g,mat=mk(bottom.c);
  if(g.skirt)r.cloth.add(band([[.25,.52],[.205,.7],[.17,.88],[.15,.98]],0,0,9,a.zs+.1,mat));
  else{r.cloth.add(band(a.torso,g.grow,.84,.96,a.zs,mat));
   [-1,1].forEach(s=>{const l=band(a.leg,g.grow,g.ymin,.95,1,mat);l.position.x=s*a.hipX;r.cloth.add(l)})}
 }
 r.pop=1;
}

/* ===== Components ===== */
function Viewer({avatarId,top,bottom,view,onView}){
 const ref=useRef(),S=useRef({}),[auto,setAuto]=useState(true),[err,setErr]=useState(''),[loading,setLoading]=useState(true);
 S.current.auto=auto;S.current.onView=onView;S.current.outfit={avatarId,top,bottom};
 useEffect(()=>{
  const cv=ref.current,s=S.current;let r;
  try{r=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){setErr('WebGL isn’t available in this browser, so the 3D viewer can’t start.');return}
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));r.outputEncoding=T.sRGBEncoding;
  const scene=new T.Scene(),cam=new T.PerspectiveCamera(32,1,.1,50);
  scene.add(new T.HemisphereLight(0xffffff,0xb5ada0,.95));
  const k=new T.DirectionalLight(0xffffff,.9);k.position.set(2,3.5,3);scene.add(k);
  const rim=new T.DirectionalLight(0xffffff,.4);rim.position.set(-2,2,-3);scene.add(rim);
  const st=s.st={yaw:0,vel:0,target:null,drag:false,z:4.6,rig:null,tok:0};
  s.setAvatar=async id=>{const tok=++st.tok;setLoading(true);let rig=null;
   try{rig=await buildGLB(AVATARS[id])}catch(e){console.warn(e)}
   if(tok!==st.tok){rig&&dispose(rig.root);return}
   if(!rig)rig=buildBody(AVATARS[id]);
   if(st.rig){scene.remove(st.rig.root);dispose(st.rig.root)}
   st.rig=rig;scene.add(rig.root);setLoading(false);s.redress()};
  s.redress=()=>{const o=s.outfit;if(o&&st.rig)dress(st.rig,AVATARS[o.avatarId],o.top,o.bottom)};
  const fit=()=>{const w=cv.clientWidth,hh=cv.clientHeight;if(!w||!hh)return;r.setSize(w,hh,false);cam.aspect=w/hh;cam.updateProjectionMatrix()};
  const ro=new ResizeObserver(fit);ro.observe(cv);fit();
  const P=new Map();let pd=0,moved=0;
  const dist=()=>{const [a,b]=[...P.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
  const dn=e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});st.drag=P.size===1;st.target=null;st.vel=0;moved=0;if(P.size===2)pd=dist()};
  const mv=e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x;p.x=e.clientX;p.y=e.clientY;
   if(P.size===2){const d=dist();st.z=Math.min(7,Math.max(2.8,st.z*pd/d));pd=d;return}
   if(Math.abs(dx)>0){st.yaw+=dx*.012;st.vel=dx*.012;if(!moved&&Math.abs(dx)>1){moved=1;setAuto(false);s.onView('free')}}};
  const up=e=>{P.delete(e.pointerId);st.drag=P.size===1};
  const wh=e=>{e.preventDefault();st.z=Math.min(7,Math.max(2.8,st.z+e.deltaY*.003))};
  cv.addEventListener('pointerdown',dn);cv.addEventListener('pointermove',mv);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('wheel',wh,{passive:false});
  let prev=performance.now(),raf;
  const loop=t=>{raf=requestAnimationFrame(loop);const dt=Math.min((t-prev)/1000,.05);prev=t;
   if(!st.drag){
    if(st.target!=null){let d=st.target-st.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));st.yaw+=d*Math.min(1,dt*7);if(Math.abs(d)<.003){st.yaw=st.target;st.target=null}}
    else{st.yaw+=st.vel;st.vel*=Math.pow(.02,dt);if(s.auto&&Math.abs(st.vel)<.004)st.yaw+=dt*.6}
   }
   const R=st.rig,tt=t/1000;
   if(R){const br=Math.sin(tt*1.6);R.core.scale.set(1+br*.006,1,1+br*.006);R.root.position.y=br*.004;
    R.arms.forEach(a=>{a.rotation.z=a.userData.s*(.07+Math.sin(tt*1.6+(a.userData.s>0?0:1))*.025)});
    R.pop=Math.max(0,R.pop-dt*3);const p=1+R.pop*.06;R.cloth.scale.set(p,1,p);R.root.rotation.y=st.yaw}
   cam.position.set(0,1.05,st.z);cam.lookAt(0,.95,0);r.render(scene,cam)};
  raf=requestAnimationFrame(loop);
  return()=>{cancelAnimationFrame(raf);ro.disconnect();cv.removeEventListener('pointerdown',dn);cv.removeEventListener('pointermove',mv);cv.removeEventListener('pointerup',up);cv.removeEventListener('pointercancel',up);cv.removeEventListener('wheel',wh);if(st.rig)dispose(st.rig.root);r.dispose()};
 },[]);
 useEffect(()=>{const s=S.current;s.setAvatar&&s.setAvatar(avatarId)},[avatarId]);
 const key=[avatarId,top&&top.g.id+top.c,bottom&&bottom.g.id+bottom.c].join('|');
 useEffect(()=>{const s=S.current;s.redress&&s.redress()},[key]);
 useEffect(()=>{const s=S.current;if(view!=='free'&&s.st){s.st.target=YAW[view];setAuto(false)}},[view]);
 const toggleAuto=()=>{const n=!auto;setAuto(n);if(n){const s=S.current;if(s.st)s.st.target=null;onView('free')}};
 return h('div',{className:'stage'},
  h('canvas',{ref,'aria-label':'3D mannequin viewer'}),
  h('span',{className:'chip'},AVATARS[avatarId].label+' mannequin · free CC0 model'),
  err&&h('p',{className:'err'},err),
  h('div',{className:'hint'},loading?'Loading model…':'Drag to rotate · pinch to zoom'),
  h('div',{className:'ctrl'},
   ...['front','side','back'].map(v=>h('button',{key:v,'aria-pressed':view===v,onClick:()=>onView(v)},v[0].toUpperCase()+v.slice(1))),
   h('button',{'aria-pressed':auto,onClick:toggleAuto},'Auto-rotate')));
}

function AvatarToggle({value,onChange}){
 return h('div',{className:'seg',role:'group','aria-label':'Avatar'},
  ...Object.keys(AVATARS).map(id=>h('button',{key:id,'aria-pressed':value===id,onClick:()=>onChange(id)},AVATARS[id].label)));
}

function Icon({id,color}){
 const P={tshirt:'M8 3 2.5 6.5 4.5 11 7 10v11h10V10l2.5 1 2-4.5L16 3a4 4 0 0 1-8 0z',jeans:'M7 3h10l1.5 18h-5L12 9l-1.5 12h-5z',shorts:'M7 4h10l1.5 9h-5.2L12 10.5 10.7 13H5.5z',skirt:'M9 4h6l4.5 16h-15z'};
 return h('svg',{viewBox:'0 0 24 24',width:52,height:52,'aria-hidden':true},
  h('path',{d:P[id]||P.tshirt,fill:color,stroke:'rgba(0,0,0,.35)',strokeWidth:.6,strokeLinejoin:'round'}),
  id==='hoodie'&&h('path',{d:'M8 3a4 4 0 0 0 8 0l-1 3H9z',fill:'rgba(0,0,0,.25)'}),
  id==='hoodie'&&h('rect',{x:9,y:15,width:6,height:3,rx:.8,fill:'rgba(0,0,0,.2)'}),
  (id==='jacket'||id==='shirt')&&h('path',{d:'M12 7v14',stroke:'rgba(0,0,0,.45)',strokeWidth:.8}),
  id==='shirt'&&h('path',{d:'M9.5 3 12 6.5 14.5 3',fill:'none',stroke:'rgba(0,0,0,.45)',strokeWidth:.8}));
}

function Catalog({tops,bottoms,sel,slot,onPick,onColor}){
 const lists={top:tops,bottom:bottoms};
 const sec=(sl,title)=>h('div',{key:sl},h('p',{className:'label'},title),
  h('div',{className:'cards'},...lists[sl].map((x,i)=>{const on=sel[sl].i===i;
   return h('button',{key:x.id,className:'card','aria-pressed':on,onClick:()=>onPick(sl,i)},
    h(Icon,{id:x.id,color:x.colors[on?sel[sl].c:0].c}),h('b',null,x.name),h('span',null,'$'+x.price))})));
 const act=lists[slot][sel[slot].i],picked=[lists.top[sel.top.i],lists.bottom[sel.bottom.i]].filter(Boolean);
 const total=picked.reduce((s,x)=>s+x.price,0);
 return h('div',null,
  h('h2',null,'Choose your look'),
  sec('top','Tops'),sec('bottom','Bottoms'),
  act&&h('div',null,h('p',{className:'label'},act.name+' colour'),
   h('div',{className:'sws'},...act.colors.map((c,i)=>h('button',{key:c.n,className:'sw',title:c.n,'aria-label':c.n,'aria-pressed':sel[slot].c===i,style:{background:c.c},onClick:()=>onColor(i)})))),
  h('div',{className:'sum'},h('span',null,picked.length?picked.map(x=>x.name).join(' + '):'Nothing selected'),h('b',null,'$'+total)),
  h('p',{className:'note'},'Tap a selected piece again to take it off. Prototype: garments are simple fitted shells; prices are sample values.'));
}

function App(){
 const [av,setAv]=useState('male'),[sel,setSel]=useState({top:{i:0,c:0},bottom:{i:0,c:0}}),[slot,setSlot]=useState('top'),[view,setView]=useState('free');
 const bl=BOTTOMS.filter(b=>!b.fOnly||av==='female');
 const pick=(s,i)=>{setSlot(s);setSel(p=>({...p,[s]:p[s].i===i?{i:-1,c:0}:{i,c:0}}))};
 const tg=TOPS[sel.top.i],bg=bl[sel.bottom.i];
 const top=tg?{g:tg,c:tg.colors[sel.top.c].c}:null,bottom=bg?{g:bg,c:bg.colors[sel.bottom.c].c}:null;
 return h('div',{className:'wrap'},
  h('header',null,h('div',{className:'logo'},'Virtual',h('i',null,'Fit')),h('span',{className:'badge'},'AI try-on · prototype')),
  h('h1',null,'Try it on, before you buy it.'),
  h('p',{className:'sub'},'Pick an avatar, choose a piece and turn the mannequin to see how it looks from every side.'),
  h('div',{className:'grid'},
   h('div',{className:'stage-col'},h(AvatarToggle,{value:av,onChange:setAv}),
    h(Viewer,{avatarId:av,top,bottom,view,onView:setView})),
   h(Catalog,{tops:TOPS,bottoms:bl,sel,slot,onPick:pick,onColor:c=>setSel(p=>({...p,[slot]:{...p[slot],c}}))})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
